name: Update Cricfy Playlist

on:
  workflow_dispatch:
  schedule:
    # Runs twice per hour at off-peak minutes. GitHub cron uses UTC.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: cricfy-playlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate playlist
        run: python ripalc.py

      - name: Validate playlist
        shell: bash
        run: |
          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u
          grep -qE '\[(LIVE|UPCOMING)\]' playlist.m3u
          grep -q '\[SPORT\]' playlist.m3u

      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist has not changed."
            exit 0
          fi

          git commit -m "chore: update playlist"
          git push
